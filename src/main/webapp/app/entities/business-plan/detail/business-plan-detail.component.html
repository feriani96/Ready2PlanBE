<div class="d-flex justify-content-center">
  <div class="col-8">
    <div *ngIf="businessPlan">
      <h2 data-cy="businessPlanDetailsHeading"><span jhiTranslate="ready2PlanBeApp.businessPlan.detail.title">Business Plan</span></h2>

      <hr />

      <jhi-alert-error></jhi-alert-error>

      <jhi-alert></jhi-alert>

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ businessPlan.id }}</span>
        </dd>
        <dt><span jhiTranslate="ready2PlanBeApp.businessPlan.name">Name</span></dt>
        <dd>
          <span>{{ businessPlan.name }}</span>
        </dd>
        <dt><span jhiTranslate="ready2PlanBeApp.businessPlan.description">Description</span></dt>
        <dd>
          <span>{{ businessPlan.description }}</span>
        </dd>
        <dt><span jhiTranslate="ready2PlanBeApp.businessPlan.creationDate">Creation Date</span></dt>
        <dd>
          <span>{{ businessPlan.creationDate }}</span>
        </dd>
        <dt><span jhiTranslate="ready2PlanBeApp.businessPlan.entropreneurName">Entropreneur Name</span></dt>
        <dd>
          <span>{{ businessPlan.entropreneurName }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/business-plan', businessPlan.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
  </div>
</div>
