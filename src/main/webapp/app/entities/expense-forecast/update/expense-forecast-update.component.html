<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-expense-forecast-heading"
        data-cy="ExpenseForecastCreateUpdateHeading"
        jhiTranslate="ready2PlanBeApp.expenseForecast.home.createOrEditLabel"
      >
        Create or edit a Expense Forecast
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="global.field.id" for="field_id">ID</label>
          <input type="text" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.expenseForecast.label" for="field_label">Label</label>
          <input type="text" class="form-control" name="label" id="field_label" data-cy="label" formControlName="label" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.expenseForecast.monthlyAmount" for="field_monthlyAmount"
            >Monthly Amount</label
          >
          <input
            type="number"
            class="form-control"
            name="monthlyAmount"
            id="field_monthlyAmount"
            data-cy="monthlyAmount"
            formControlName="monthlyAmount"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.expenseForecast.forecast" for="field_forecast">Forecast</label>
          <select
            class="form-control"
            id="field_forecast"
            data-cy="forecast"
            name="forecast"
            formControlName="forecast"
            [compareWith]="compareFinancialForecast"
          >
            <option [ngValue]="null"></option>
            <option [ngValue]="financialForecastOption" *ngFor="let financialForecastOption of financialForecastsSharedCollection">
              {{ financialForecastOption.startDate }}
            </option>
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
