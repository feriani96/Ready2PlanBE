<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-revenue-forecast-heading"
        data-cy="RevenueForecastCreateUpdateHeading"
        jhiTranslate="ready2PlanBeApp.revenueForecast.home.createOrEditLabel"
      >
        Create or edit a Revenue Forecast
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="global.field.id" for="field_id">ID</label>
          <input type="text" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.revenueForecast.month" for="field_month">Month</label>
          <input type="number" class="form-control" name="month" id="field_month" data-cy="month" formControlName="month" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.revenueForecast.year" for="field_year">Year</label>
          <input type="number" class="form-control" name="year" id="field_year" data-cy="year" formControlName="year" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.revenueForecast.unitsSold" for="field_unitsSold">Units Sold</label>
          <input type="number" class="form-control" name="unitsSold" id="field_unitsSold" data-cy="unitsSold" formControlName="unitsSold" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.revenueForecast.totalRevenue" for="field_totalRevenue"
            >Total Revenue</label
          >
          <input
            type="number"
            class="form-control"
            name="totalRevenue"
            id="field_totalRevenue"
            data-cy="totalRevenue"
            formControlName="totalRevenue"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.revenueForecast.product" for="field_product">Product</label>
          <select
            class="form-control"
            id="field_product"
            data-cy="product"
            name="product"
            formControlName="product"
            [compareWith]="compareProductOrService"
          >
            <option [ngValue]="null"></option>
            <option [ngValue]="productOrServiceOption" *ngFor="let productOrServiceOption of productOrServicesSharedCollection">
              {{ productOrServiceOption.name }}
            </option>
          </select>
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.revenueForecast.forecast" for="field_forecast">Forecast</label>
          <select
            class="form-control"
            id="field_forecast"
            data-cy="forecast"
            name="forecast"
            formControlName="forecast"
            [compareWith]="compareFinancialForecast"
          >
            <option [ngValue]="null"></option>
            <option [ngValue]="financialForecastOption" *ngFor="let financialForecastOption of financialForecastsSharedCollection">
              {{ financialForecastOption.startDate }}
            </option>
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
