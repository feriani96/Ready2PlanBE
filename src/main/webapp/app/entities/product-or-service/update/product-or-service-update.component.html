<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" role="form" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-product-or-service-heading"
        data-cy="ProductOrServiceCreateUpdateHeading"
        jhiTranslate="ready2PlanBeApp.productOrService.home.createOrEditLabel"
      >
        Create or edit a Product Or Service
      </h2>

      <div>
        <jhi-alert-error></jhi-alert-error>

        <div class="row mb-3" *ngIf="editForm.controls.id.value !== null">
          <label class="form-label" jhiTranslate="global.field.id" for="field_id">ID</label>
          <input type="text" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.productOrService.name" for="field_name">Name</label>
          <input type="text" class="form-control" name="name" id="field_name" data-cy="name" formControlName="name" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.productOrService.description" for="field_description">Description</label>
          <input
            type="text"
            class="form-control"
            name="description"
            id="field_description"
            data-cy="description"
            formControlName="description"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.productOrService.unitPrice" for="field_unitPrice">Unit Price</label>
          <input type="number" class="form-control" name="unitPrice" id="field_unitPrice" data-cy="unitPrice" formControlName="unitPrice" />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.productOrService.estimatedMonthlySales" for="field_estimatedMonthlySales"
            >Estimated Monthly Sales</label
          >
          <input
            type="number"
            class="form-control"
            name="estimatedMonthlySales"
            id="field_estimatedMonthlySales"
            data-cy="estimatedMonthlySales"
            formControlName="estimatedMonthlySales"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.productOrService.durationInMonths" for="field_durationInMonths"
            >Duration In Months</label
          >
          <input
            type="number"
            class="form-control"
            name="durationInMonths"
            id="field_durationInMonths"
            data-cy="durationInMonths"
            formControlName="durationInMonths"
          />
        </div>

        <div class="row mb-3">
          <label class="form-label" jhiTranslate="ready2PlanBeApp.productOrService.businessPlan" for="field_businessPlan"
            >Business Plan</label
          >
          <select
            class="form-control"
            id="field_businessPlan"
            data-cy="businessPlan"
            name="businessPlan"
            formControlName="businessPlan"
            [compareWith]="compareBusinessPlan"
          >
            <option [ngValue]="null"></option>
            <option [ngValue]="businessPlanOption" *ngFor="let businessPlanOption of businessPlansSharedCollection">
              {{ businessPlanOption.name }}
            </option>
          </select>
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban"></fa-icon>&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving"
          class="btn btn-primary"
        >
          <fa-icon icon="save"></fa-icon>&nbsp;<span jhiTranslate="entity.action.save">Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
